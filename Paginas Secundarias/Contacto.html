            <h1 class="titulo-seccion">Escríbenos</h1>
            <p class="texto-seccion">¿Tienes dudas sobre nuestros sistemas hidropónicos o quieres cotizar un proyecto a medida? Déjanos tus datos y un experto de Sativa Nova te contactará.</p>
            
            <form class="formulario-contacto" action="#" method="POST">
                <input type="text" name="nombre" placeholder="Tu Nombre Completo" required>
                <input type="email" name="correo" placeholder="Tu Correo Electrónico" required>
                <input type="tel" name="telefono" placeholder="Tu Teléfono (Opcional)">
                <textarea name="mensaje" placeholder="¿En qué podemos ayudarte?" required></textarea>
                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
            </form>
        </div>
    </section>
