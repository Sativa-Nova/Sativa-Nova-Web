    <style>
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

            margin-top: 30px;
        }
        .galeria-item {
            position: relative;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(40, 211, 77, 0.3);
            background: rgba(20, 20, 28, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            transition: transform 0.3s ease;
        }
        .galeria-item:hover {
            transform: scale(1.03);
            border-color: #28d34d;
        }
        .galeria-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
